<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova AI</title>
<style>
:root{--bg:#212121;--panel:#171717;--surface:#303030;--text:#f5f5f5;--muted:#aaa;--border:#414141;--accent:#4285f4;--user:#343434}
body.light{--bg:#f7f7f8;--panel:#eee;--surface:#fff;--text:#222;--muted:#707070;--border:#d8d8dc;--user:#e5e5e5}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
.sidebar{width:265px;flex-shrink:0;background:var(--panel);display:flex;flex-direction:column;padding:16px 12px;border-right:1px solid var(--border);z-index:10}
.brand{font-size:23px;font-weight:bold;padding:8px 10px 22px}
.brand span{color:var(--accent)}
.new-chat{padding:13px;border:1px solid var(--border);background:var(--surface);border-radius:10px;text-align:left}
.section{color:var(--muted);font-size:12px;margin:25px 8px 10px}
#chatList{overflow:auto;flex:1}
.chat-item{display:flex;align-items:center;border-radius:9px;margin-bottom:4px}
.chat-item.active{background:#444}
.chat-select{flex:1;min-width:0;padding:11px 9px;background:transparent;border:0;color:var(--text);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.small{background:transparent;border:0;padding:8px;color:var(--muted)}
.bottom{border-top:1px solid var(--border);padding-top:12px;display:grid;gap:7px}
.side-option{background:transparent;border:0;padding:11px;text-align:left;border-radius:9px;color:var(--text)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topbar{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--border)}
.menu{display:none;background:transparent;border:0;font-size:23px}
#chat{flex:1;overflow:auto;padding:25px 18px 35px;width:100%;max-width:900px;margin:auto}
.welcome{text-align:center;margin:13vh auto 35px}
.welcome h1{font-size:clamp(30px,5vw,43px)}
.welcome p{color:var(--muted)}
.prompts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:650px;margin:30px auto}
.prompt{text-align:left;padding:16px;border:1px solid var(--border);background:var(--surface);border-radius:13px;color:var(--text)}
.prompt strong,.prompt small{display:block}
.prompt small{color:var(--muted);margin-top:6px}
.message{display:flex;flex-direction:column;gap:8px;margin:22px 0}
.message.user{align-items:flex-end}
.message.ai{align-items:flex-start}
.bubble{max-width:min(88%,720px);border-radius:16px;padding:13px 17px;line-height:1.65;overflow-wrap:anywhere;font-size:15px}
.user .bubble{background:var(--user)}
.ai .bubble{padding-left:2px}
.bubble pre{overflow:auto;background:#111;color:white;padding:13px;border-radius:9px}
.bubble code{background:#444;padding:2px 4px;border-radius:4px}
.bubble img{display:block;max-width:230px;max-height:230px;border-radius:10px;margin-top:8px}
.tools button{background:transparent;border:0;color:var(--muted);font-size:12px}
.typing{display:flex;gap:5px;padding:12px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink .8s infinite alternate}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{to{opacity:.2}}
.composer-wrap{width:100%;max-width:900px;padding:10px 18px 18px;margin:auto}
.composer{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:10px 12px}
#messageInput{display:block;width:100%;background:transparent;border:0;outline:none;color:var(--text);padding:9px;font-size:16px;resize:none;min-height:42px;max-height:140px}
.actions{display:flex;justify-content:space-between;align-items:center}
.tool{border:0;background:transparent;color:var(--muted);padding:9px}
.send,.primary{border:0;border-radius:9px;padding:10px 16px;background:var(--accent);color:white}
.send:disabled{opacity:.5}
#imagePreview{display:none;padding:7px}
#previewImage{width:70px;height:70px;object-fit:cover;border-radius:8px}
.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:8px}
#settings{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:center;justify-content:center;padding:15px}
.card{width:100%;max-width:400px;background:var(--panel);padding:22px;border-radius:15px;border:1px solid var(--border)}
.row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
select{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:7px;border-radius:7px}
#shade{display:none}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#444;color:white;padding:10px 16px;border-radius:9px;opacity:0;z-index:30}
#toast.show{opacity:1}
@media(max-width:700px){
.sidebar{position:fixed;left:-280px;top:0;bottom:0;transition:left .2s}
.sidebar.open{left:0}
.menu{display:block}
#shade.show{display:block;position:fixed;inset:0;background:#0008;z-index:8}
.prompts{grid-template-columns:1fr}
.welcome{margin-top:8vh}
.bubble{max-width:95%}
}
</style>
</head>
<body>

<div id="shade"></div>

<aside class="sidebar" id="sidebar">
<div class="brand">Nova<span>.</span></div>
<button class="new-chat" id="newChat">＋ New chat</button>
<div class="section">YOUR CHATS</div>
<div id="chatList"></div>
<div class="bottom">
<button class="side-option" id="themeButton">◐ Change theme</button>
<button class="side-option" id="settingsButton">⚙ Settings</button>
<button class="side-option" id="clearButton">⌫ Clear all chats</button>
</div>
</aside>

<main class="main">
<header class="topbar">
<button class="menu" id="menuButton">☰</button>
<b>Nova AI</b>
</header>

<section id="chat">
<div class="welcome" id="welcome">
<h1>How can I help?</h1>
<p>Ask me anything. Let's figure it out together.</p>
<div class="prompts">
<button class="prompt" data-prompt="Explain something difficult to me in simple terms."><strong>Explain something</strong><small>Make difficult topics easier</small></button>
<button class="prompt" data-prompt="Help me brainstorm creative ideas."><strong>Brainstorm ideas</strong><small>Think of something new</small></button>
<button class="prompt" data-prompt="Help me write something clearly."><strong>Help me write</strong><small>Emails, essays, and more</small></button>
<button class="prompt" data-prompt="Help me understand my homework step by step."><strong>Homework help</strong><small>Learn one step at a time</small></button>
</div>
</div>
<div id="messages"></div>
</section>

<div class="composer-wrap">
<div class="composer">
<div id="imagePreview">
<img id="previewImage" alt="Preview">
<button class="tool" id="removeImage">Remove image ×</button>
</div>
<textarea id="messageInput" rows="1" placeholder="Message Nova..."></textarea>
<div class="actions">
<div>
<button class="tool" id="uploadButton">＋ Image</button>
<input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" hidden>
<button class="tool" id="voiceButton">🎙 Voice</button>
</div>
<button class="send" id="sendButton">Send ↑</button>
</div>
</div>
<div class="hint">Nova can make mistakes. Check important information.</div>
</div>
</main>

<div id="settings">
<div class="card">
<h2>Settings <button class="small" id="closeSettings" style="float:right">×</button></h2>
<div class="row">Appearance
<select id="themeSelect"><option value="dark">Dark</option><option value="light">Light</option></select>
</div>
<div class="row">Text size
<select id="fontSelect"><option value="15">Normal</option><option value="17">Large</option><option value="19">Extra large</option></select>
</div>
<div class="row">Saved chats <span id="chatCount">0</span></div>
<p style="color:var(--muted);font-size:12px">Chats are saved in this browser on this device, not synced between devices.</p>
<button class="primary" id="doneSettings">Done</button>
</div>
</div>

<div id="toast"></div>

<script>
const API_URL="/api/chat";
const KEY="nova_chats_v1";
let chats=readChats();
let activeId=chats[0]?.id||null;
let imageData=null;
let busy=false;

const $=id=>document.getElementById(id);
const input=$("messageInput");

function readChats(){
try{
let x=JSON.parse(localStorage.getItem(KEY)||"[]");
return Array.isArray(x)?x:[];
}catch{return []}
}

function save(){
try{
localStorage.setItem(KEY,JSON.stringify(chats));
}catch{
notify("Browser storage is full. Delete an old chat.");
}
}

function notify(s){
$("toast").textContent=s;
$("toast").classList.add("show");
setTimeout(()=>$("toast").classList.remove("show"),2400);
}

function current(){
return chats.find(c=>c.id===activeId);
}

function newChat(){
let c={id:Date.now()+Math.random(),title:"New chat",messages:[]};
chats.unshift(c);
activeId=c.id;
save();
render();
closeMenu();
}

function renderList(){
$("chatList").innerHTML="";
chats.forEach(c=>{
let row=document.createElement("div");
row.className="chat-item"+(c.id===activeId?" active":"");

let b=document.createElement("button");
b.className="chat-select";
b.textContent=c.title;
b.onclick=()=>{
activeId=c.id;
render();
closeMenu();
};

let r=document.createElement("button");
r.className="small";
r.textContent="✎";
r.title="Rename";
r.onclick=()=>{
let n=prompt("Rename chat:",c.title);
if(n&&n.trim()){
c.title=n.trim().slice(0,60);
save();
renderList();
}
};

let d=document.createElement("button");
d.className="small";
d.textContent="×";
d.title="Delete";
d.onclick=()=>{
if(confirm("Delete this chat?")){
chats=chats.filter(x=>x.id!==c.id);
if(activeId===c.id)activeId=chats[0]?.id||null;
save();
render();
}
};

row.append(b,r,d);
$("chatList").append(row);
});
$("chatCount").textContent=chats.length;
}

function safe(s){
return String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function format(s){
let blocks=[];
s=safe(s).replace(/```([\w-]*)\n?([\s\S]*?)```/g,(_,l,c)=>{
blocks.push("<pre><code>"+c.trim()+"</code></pre>");
return "%%"+(blocks.length-1)+"%%";
});
s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
s=s.replace(/\*\*(.*?)\*\*/g,"<b>$1</b>");
s=s.split(/\n\n+/).map(p=>
/^%%\d+%%$/.test(p)?p:"<p>"+p.replace(/\n/g,"<br>")+"</p>"
).join("");
return s.replace(/%%(\d+)%%/g,(_,i)=>blocks[+i]);
}

function render(){
renderList();
let c=current();
$("welcome").style.display=c&&c.messages.length?"none":"block";
$("messages").innerHTML="";
if(c)c.messages.forEach(m=>draw(m));
$("chat").scrollTop=$("chat").scrollHeight;
}

function draw(m){
let w=document.createElement("div");
w.className="message "+(m.role==="user"?"user":"ai");
let b=document.createElement("div");
b.className="bubble";

if(m.role==="user"){
b.textContent=m.content||"";
if(m.image){
let im=document.createElement("img");
im.src=m.image;
im.alt="Uploaded image";
b.append(im);
}
}else{
b.innerHTML=format(m.content||"");
}

w.append(b);

if(m.role==="assistant"){
let tools=document.createElement("div");
tools.className="tools";
let cp=document.createElement("button");
cp.textContent="Copy";
cp.onclick=()=>{
navigator.clipboard?.writeText(m.content)
.then(()=>notify("Copied"))
.catch(()=>notify("Copy unavailable"));
};
tools.append(cp);
w.append(tools);
}
$("messages").append(w);
}

function typing(){
let w=document.createElement("div");
w.id="typing";
w.className="message ai";
w.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';
$("messages").append(w);
$("chat").scrollTop=$("chat").scrollHeight;
}

function resize(){
input.style.height="auto";
input.style.height=Math.min(input.scrollHeight,140)+"px";
}

async function send(override){
if(busy)return;
let text=(override??input.value).trim();
if(!text&&!imageData)return;

if(!current())newChat();
let c=current();
let img=imageData;

let user={
role:"user",
content:text||"What is in this image?",
...(img?{image:img}:{})
};

if(!c.messages.length)c.title=user.content.slice(0,38);
c.messages.push(user);
imageData=null;
$("imagePreview").style.display="none";
$("previewImage").src="";
input.value="";
resize();
save();
render();

busy=true;
$("sendButton").disabled=true;
typing();

try{
let history=c.messages.map(m=>({role:m.role,content:m.content}));
let response=await fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({messages:history,image:img})
});
let data=await response.json().catch(()=>({}));
$("typing")?.remove();

if(!response.ok)throw Error(data.error||"The AI could not answer.");
if(!data.reply)throw Error("The AI returned an empty response.");

c.messages.push({role:"assistant",content:data.reply});
save();
render();

}catch(e){
$("typing")?.remove();
c.messages.push({
role:"assistant",
content:"I couldn't get a response from the AI.\n\n"+e.message
});
save();
render();
}finally{
busy=false;
$("sendButton").disabled=false;
input.focus();
}
}

$("newChat").onclick=newChat;
$("sendButton").onclick=()=>send();
input.addEventListener("input",resize);
input.addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
send();
}
});

document.querySelectorAll(".prompt").forEach(b=>{
b.onclick=()=>send(b.dataset.prompt);
});

$("uploadButton").onclick=()=>$("imageInput").click();

$("imageInput").onchange=()=>{
let f=$("imageInput").files[0];
if(!f)return;

if(!["image/jpeg","image/png","image/webp"].includes(f.type)||f.size>5*1024*1024){
notify("Choose a JPG, PNG, or WEBP under 5 MB.");
return;
}

let rd=new FileReader();
rd.onload=()=>{
let im=new Image();
im.onload=()=>{
let scale=Math.min(1,1200/Math.max(im.width,im.height));
let cv=document.createElement("canvas");
cv.width=im.width*scale;
cv.height=im.height*scale;
cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
imageData=cv.toDataURL("image/jpeg",.78);
$("previewImage").src=imageData;
$("imagePreview").style.display="block";
};
im.src=rd.result;
};
rd.readAsDataURL(f);
$("imageInput").value="";
};

$("removeImage").onclick=()=>{
imageData=null;
$("imagePreview").style.display="none";
};

function theme(t){
document.body.classList.toggle("light",t==="light");
localStorage.setItem("nova_theme",t);
$("themeSelect").value=t;
}
theme(localStorage.getItem("nova_theme")||"dark");

$("themeButton").onclick=()=>{
theme(document.body.classList.contains("light")?"dark":"light");
};
$("themeSelect").onchange=e=>theme(e.target.value);

function font(n){
document.querySelectorAll(".bubble").forEach(x=>x.style.fontSize=n+"px");
localStorage.setItem("nova_font",n);
}
$("fontSelect").value=localStorage.getItem("nova_font")||"15";
font($("fontSelect").value);
$("fontSelect").onchange=e=>font(e.target.value);

$("settingsButton").onclick=()=>$("settings").style.display="flex";
$("closeSettings").onclick=$("doneSettings").onclick=()=>$("settings").style.display="none";

$("clearButton").onclick=()=>{
if(chats.length&&confirm("Delete all saved chats?")){
chats=[];
activeId=null;
save();
render();
}
};

$("menuButton").onclick=()=>{
$("sidebar").classList.toggle("open");
$("shade").classList.toggle("show");
};

function closeMenu(){
$("sidebar").classList.remove("open");
$("shade").classList.remove("show");
}
$("shade").onclick=closeMenu;

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

if(SR){
let rec=new SR();
rec.lang="en-US";
rec.onresult=e=>{
input.value+=(input.value?" ":"")+e.results[0][0].transcript;
resize();
};
$("voiceButton").onclick=()=>{
try{
rec.start();
notify("Listening...");
}catch{
notify("Voice input is already running.");
}
};
}else{
$("voiceButton").onclick=()=>notify("Voice input is not supported in this browser.");
}

render();
</script>
</body>
</html>
