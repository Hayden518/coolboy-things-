<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #212121;
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
}

.sidebar {
  width: 230px;
  background: #171717;
  padding: 20px;
}

.sidebar button {
  width: 100%;
  padding: 13px;
  background: #303030;
  color: white;
  border: 1px solid #555;
  border-radius: 10px;
  cursor: pointer;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

header {
  padding: 20px;
  border-bottom: 1px solid #444;
  font-size: 18px;
  font-weight: bold;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  width: 100%;
  max-width: 850px;
  margin: auto;
}

.welcome {
  text-align: center;
  margin-top: 18vh;
}

.welcome h1 {
  font-size: 32px;
}

.message {
  padding: 15px;
  margin: 12px 0;
  border-radius: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #343434;
}

.ai {
  background: #292929;
}

.message img {
  display: block;
  max-width: 230px;
  max-height: 230px;
  margin-top: 10px;
  border-radius: 10px;
}

.input-area {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 16px;
}

.input-box {
  background: #303030;
  border: 1px solid #555;
  border-radius: 16px;
  padding: 12px;
}

textarea {
  width: 100%;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  resize: vertical;
  padding: 10px;
  font-size: 16px;
}

.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.controls button {
  padding: 12px 16px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

#upload {
  background: #444;
  color: white;
}

#send {
  background: white;
  color: black;
  font-weight: bold;
}

#preview {
  display: none;
  max-width: 100px;
  max-height: 100px;
  margin: 8px;
  border-radius: 8px;
}

.small {
  text-align: center;
  color: #999;
  font-size: 12px;
  margin-top: 10px;
}

@media(max-width:600px) {
  .sidebar {
    display: none;
  }
  #chat {
    padding: 12px;
  }
}
</style>
</head>

<body>

<aside class="sidebar">
  <h2>My AI</h2>
  <button onclick="newChat()">+ New Chat</button>
</aside>

<main class="main">

<header>My AI Assistant</header>

<section id="chat">
  <div class="welcome" id="welcome">
    <h1>How can I help you?</h1>
    <p>Ask me anything or upload a picture.</p>
  </div>
</section>

<div class="input-area">
  <div class="input-box">

    <img id="preview" alt="Image preview">

    <textarea id="prompt"
      placeholder="Message My AI..."
      rows="2"></textarea>

    <div class="controls">

      <div>
        <button id="upload"
          onclick="document.getElementById('file').click()">
          + Image
        </button>

        <input
          id="file"
          type="file"
          accept="image/png,image/jpeg,image/webp"
          hidden
          onchange="selectImage(event)">
      </div>

      <button id="send" onclick="sendMessage()">
        Send
      </button>

    </div>
  </div>

  <div class="small">
    My AI can make mistakes. Check important information.
  </div>
</div>

</main>

<script>
const chat = document.getElementById("chat");
const promptBox = document.getElementById("prompt");
const fileBox = document.getElementById("file");
const preview = document.getElementById("preview");

let messages = [];
let selectedImage = null;
let busy = false;

// ADD YOUR VERCEL BACKEND ADDRESS HERE LATER.
const API_URL = "";

function addMessage(text, type, image) {
  document.getElementById("welcome")?.remove();

  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;

  if (image) {
    const img = document.createElement("img");
    img.src = image;
    img.alt = "Uploaded image";
    div.appendChild(img);
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  return div;
}

function selectImage(event) {
  const file = event.target.files[0];

  if (!file) return;

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    alert("Please select a JPG, PNG, or WEBP image.");
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    alert("Image must be smaller than 5 MB.");
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    selectedImage = reader.result;
    preview.src = selectedImage;
    preview.style.display = "block";
  };

  reader.readAsDataURL(file);
}

async function sendMessage() {
  const text = promptBox.value.trim();

  if ((!text && !selectedImage) || busy) return;

  const image = selectedImage;

  addMessage(text || "What is in this picture?", "user", image);

  messages.push({
    role: "user",
    content: text || "Please describe this image."
  });

  promptBox.value = "";
  selectedImage = null;
  preview.style.display = "none";
  fileBox.value = "";

  busy = true;

  const loading = addMessage("Thinking...", "ai");

  try {
    const response = await fetch(API_URL + "/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messages,
        image: image
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error("AI connection failed");
    }

    loading.textContent = data.reply;

    messages.push({
      role: "assistant",
      content: data.reply
    });

  } catch (error) {
    loading.textContent =
      "I couldn't connect to the AI yet. The backend still needs to be connected.";
  }

  busy = false;
  chat.scrollTop = chat.scrollHeight;
}

function newChat() {
  messages = [];
  selectedImage = null;
  fileBox.value = "";
  preview.style.display = "none";
  promptBox.value = "";

  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>How can I help you?</h1>
      <p>Ask me anything or upload a picture.</p>
    </div>
  `;
}

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
